<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>업무일지</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <button id="syncBtn" class="sync-btn" type="button" aria-label="지금 동기화" title="지금 동기화">
    <span id="syncDot" class="sync-dot" aria-hidden="true"></span>
    <span id="syncStatusText" class="sr-only">동기화 상태</span>
  </button>

  <main>
    <section id="view-today" class="view">
      <header class="day-header">
        <div>
          <div id="todayDateMain" class="date-main"></div>
          <div id="todayDateSub" class="date-sub"></div>
        </div>
        <div class="day-nav">
          <button id="prevDay" type="button" aria-label="이전 날">‹</button>
          <button id="todayBtn" class="today-jump" type="button">오늘</button>
          <button id="nextDay" type="button" aria-label="다음 날">›</button>
        </div>
      </header>

      <section class="quick-add" aria-label="빠른 기록">
        <div class="add-row">
          <input id="quickContent" class="content-input" type="text" maxlength="500" autocomplete="off" enterkeyhint="done" placeholder="무슨 일을 했어?" aria-label="업무명">
          <button id="quickAddBtn" class="add-btn" type="button">저장</button>
        </div>

        <button id="recordingDateHint" class="recording-date-hint" type="button" hidden></button>

        <div class="origin-row" role="group" aria-label="업무 발생 경로">
          <button class="origin-chip active" data-origin="" type="button">기본</button>
          <button class="origin-chip" data-origin="request" type="button">요청받음</button>
          <button class="origin-chip" data-origin="self" type="button">내가 먼저 함</button>
        </div>

        <div class="quick-flags" role="group" aria-label="업무 맥락 태그">
          <label class="quick-flag meeting"><input id="quickMeeting" type="checkbox"><span>회의</span></label>
          <label class="quick-flag solved"><input id="quickSolved" type="checkbox"><span>문제해결</span></label>
          <label class="quick-flag support"><input id="quickSupport" type="checkbox"><span>협업·지원</span></label>
        </div>

        <div id="requestFields" class="request-fields" hidden>
          <div class="request-line">
            <input id="requesterInput" type="text" maxlength="80" list="requesterList" autocomplete="off" placeholder="요청자 이름" aria-label="요청자 이름">
            <datalist id="requesterList"></datalist>
          </div>
          <div class="when-row" role="group" aria-label="언제 할 요청인지">
            <button class="when-chip active" data-when="now" type="button">지금</button>
            <button class="when-chip" data-when="today" type="button">오늘</button>
            <button class="when-chip" data-when="tomorrow" type="button">내일</button>
            <button class="when-chip" data-when="date" type="button">날짜</button>
            <input id="requestDueDate" type="date" aria-label="요청 예정일" hidden>
          </div>
          <p class="microcopy">요청받은 시각은 저장하는 순간 자동으로 남아.</p>
        </div>

        <details class="extra-details">
          <summary>추가 정보</summary>
          <div class="extra-grid">
            <input id="quickProject" type="text" maxlength="120" autocomplete="off" placeholder="프로젝트 (선택)" aria-label="프로젝트">
            <input id="quickMemo" type="text" maxlength="500" autocomplete="off" placeholder="메모 (선택)" aria-label="메모">
          </div>
        </details>
      </section>

      <section id="pendingSection" class="pending-section" hidden>
        <div class="section-title-row">
          <h2>해야 할 요청</h2>
          <span id="pendingCount" class="count-badge"></span>
        </div>
        <div id="pendingList" class="pending-list"></div>
      </section>

      <section class="timeline-section">
        <div class="section-title-row">
          <h2>기록</h2>
          <span id="dayCount" class="section-note"></span>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>

      <details class="reflection" id="reflectionBox">
        <summary>
          <span id="reflectionTitle">오늘 회고</span>
          <span id="reflectionHint" class="hint">비어있음</span>
        </summary>
        <div class="fields">
          <div class="field">
            <label for="fSummary">한 줄 요약</label>
            <textarea id="fSummary" maxlength="500" placeholder="오늘의 핵심"></textarea>
          </div>
          <div class="field">
            <label for="fDifficulty">힘들었던 점과 이유</label>
            <textarea id="fDifficulty" maxlength="500" placeholder="번아웃 신호나 방해 요인이 있었는지"></textarea>
          </div>
          <div class="field">
            <label for="fAchievement">잘한 점</label>
            <textarea id="fAchievement" maxlength="500" placeholder="오늘 해낸 것, 성장한 점"></textarea>
          </div>
          <div class="field">
            <label for="fTomorrow">내일은?</label>
            <textarea id="fTomorrow" maxlength="500" placeholder="이어갈 것"></textarea>
          </div>
          <div id="saveHint" class="save-hint">&nbsp;</div>
        </div>
      </details>
    </section>

    <section id="view-summary" class="view" hidden>
      <header class="view-header summary-header">
        <h1>월별 요약</h1>
        <div class="month-nav">
          <button id="prevMonth" type="button" aria-label="이전 달">‹</button>
          <span id="monthLabel"></span>
          <button id="nextMonth" type="button" aria-label="다음 달">›</button>
        </div>
      </header>
      <div id="monthSummary" class="summary-wrap"></div>
    </section>

    <section id="view-history" class="view" hidden>
      <header class="view-header">
        <h1>히스토리</h1>
      </header>
      <div class="search-box">
        <input type="search" id="searchInput" aria-label="히스토리 검색" placeholder="업무, 요청자, 프로젝트, 메모 검색">
      </div>
      <div id="histList" class="hist-list"></div>
    </section>

    <section id="view-settings" class="view" hidden>
      <header class="view-header">
        <h1>설정</h1>
      </header>
      <div class="settings-wrap">
        <section class="setting-card">
          <h2>구글 시트 연동</h2>
          <p class="setting-help">기존 업무일지의 URL과 토큰을 그대로 사용해. 새 Code.gs는 기존 시트의 행을 지우지 않고 필요한 컬럼만 뒤에 추가해.</p>
          <label class="field single"><span>Apps Script 웹 앱 URL</span><textarea id="gasUrlInput" rows="3" placeholder="https://script.google.com/macros/s/.../exec"></textarea></label>
          <label class="field single"><span>API 토큰</span><div class="token-row"><input id="gasTokenInput" type="password" autocomplete="off" placeholder="Code.gs의 TOKEN과 같은 값"><button id="tokenToggle" class="text-btn" type="button">보기</button></div></label>
          <div class="settings-actions">
            <button id="gasUrlSave" class="primary-btn" type="button">저장 및 연결 확인</button>
            <button id="syncNowBtn" class="secondary-btn" type="button">지금 동기화</button>
            <button id="fullResyncBtn" class="secondary-btn" type="button">전체 다시 맞추기</button>
          </div>
          <div id="gasStatusText" class="setting-status">&nbsp;</div>
          <div id="syncDetailText" class="setting-status"></div>
        </section>

        <section class="setting-card">
          <h2>데이터</h2>
          <p id="dataStatusText" class="setting-help"></p>
          <div class="settings-actions data-actions">
            <button id="exportBackupBtn" class="secondary-btn" type="button">백업 JSON 저장</button>
            <button id="importBackupBtn" class="secondary-btn" type="button">백업 불러오기</button>
            <button id="exportCsvBtn" class="secondary-btn" type="button">CSV 저장</button>
          </div>
          <input id="importBackupFile" type="file" accept="application/json,.json" hidden>
        </section>
      </div>
    </section>
  </main>

  <nav class="tab-bar" aria-label="주 메뉴">
    <button class="tab-btn active" data-view="today" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
      오늘
    </button>
    <button class="tab-btn" data-view="summary" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      월요약
    </button>
    <button class="tab-btn" data-view="history" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      히스토리
    </button>
    <button class="tab-btn" data-view="settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1A8 8 0 0 0 14.5 5L14 2h-4l-.5 3a8 8 0 0 0-2 1.9l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 2 1.9l.5 3h4l.5-3a8 8 0 0 0 2-1.9l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
      설정
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <div id="editModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-head">
        <h2 id="editTitle">기록 수정</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="edit-two">
          <label><span>날짜</span><input id="editDate" type="date"></label>
          <label><span>시작 시각</span><input id="editTime" type="time"></label>
        </div>
        <div id="editLegacyCatWrap" class="legacy-cat-field" hidden><span>기존 기록 종류</span><strong id="editLegacyCat"></strong></div>
        <label><span>업무명</span><textarea id="editContent" rows="3" maxlength="500"></textarea></label>
        <label><span>발생 경로</span><select id="editOrigin"><option value="">기본</option><option value="request">요청받음</option><option value="self">내가 먼저 함</option></select></label>
        <div id="editRequestFields">
          <label><span>요청자</span><input id="editRequester" type="text" maxlength="80"></label>
          <label><span>요청받은 시각</span><input id="editRequestedAt" type="datetime-local"></label>
          <label><span>원래 예정일</span><input id="editDueDate" type="date"></label>
        </div>
        <button id="editReturnPendingBtn" class="secondary-btn full" type="button" hidden>해야 할 요청으로 되돌리기</button>
        <label><span>프로젝트</span><input id="editProject" type="text" maxlength="120"></label>
        <label><span>메모</span><textarea id="editMemo" rows="2" maxlength="500"></textarea></label>
        <div class="edit-flags" role="group" aria-label="업무 맥락 태그">
          <label class="check-line"><input id="editMeeting" type="checkbox"><span>회의</span></label>
          <label class="check-line"><input id="editSolved" type="checkbox"><span>문제해결</span></label>
          <label class="check-line"><input id="editSupport" type="checkbox"><span>협업·지원</span></label>
        </div>
        <label class="check-line"><input id="editHighlight" type="checkbox"><span>평가 때 기억할 대표 업무</span></label>
      </div>
      <div class="modal-actions">
        <button id="editDeleteBtn" class="danger-btn" type="button">삭제</button>
        <span class="modal-spacer"></span>
        <button class="secondary-btn" type="button" data-close-modal>취소</button>
        <button id="editSaveBtn" class="primary-btn" type="button">저장</button>
      </div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
