<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>업무일지</title><meta name="theme-color" content="#1F3D3A"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<button class="sync-control" id="syncBtn" type="button" aria-label="동기화 상태: 연동 안 함" title="동기화"><span class="sync-dot" id="syncDot" aria-hidden="true"></span></button>
<section id="view-today" class="view" data-view="today">
  <header class="day-header"><div class="date-line"><div><div class="date-main" id="todayDateMain"></div><div class="date-sub" id="todayDateSub"></div></div><div class="day-nav"><button id="prevDay" type="button" aria-label="이전 날">‹</button><button id="todayBtn" type="button" aria-label="오늘로 이동">•</button><button id="nextDay" type="button" aria-label="다음 날">›</button></div></div></header>
  <div class="quick-add"><div class="chip-row" id="chipRow" role="group" aria-label="업무 종류"><button class="chip active" data-cat="업무" type="button" aria-pressed="true">업무</button><button class="chip" data-cat="회의" type="button" aria-pressed="false">회의</button><button class="chip" data-cat="요청" type="button" aria-pressed="false">요청받은 일</button><button class="chip" data-cat="해결" type="button" aria-pressed="false">해결한 문제</button><button class="chip" data-cat="기타" type="button" aria-pressed="false">기타</button></div><div class="add-row"><input type="time" class="time-input" id="itemTime" aria-label="시간"><input type="text" class="content-input" id="itemContent" maxlength="500" enterkeyhint="done" autocomplete="off" placeholder="바로 적기 (엔터로 추가)"><button class="add-btn" id="addBtn" type="button" aria-label="업무 기록 추가" disabled>+</button></div><div class="draft-hint" id="draftHint"></div></div>
  <div class="timeline" id="timeline"></div>
  <details class="reflection" id="reflectionBox"><summary><span>오늘 정리</span><span class="hint" id="reflectionHint">비어있음</span></summary><div class="fields">
    <div class="field"><label for="fSummary">오늘 한 줄 <span class="count" data-count-for="fSummary"></span></label><textarea id="fSummary" rows="1" maxlength="500" placeholder="오늘을 한 줄로 요약하면"></textarea></div>
    <div class="field"><label for="fDifficulty">어려웠던 점 &amp; 이유 <span class="count" data-count-for="fDifficulty"></span></label><textarea id="fDifficulty" maxlength="500" placeholder="뭐가 어려웠고 왜 그랬는지"></textarea></div>
    <div class="field"><label for="fAchievement">잘한 점 <span class="count" data-count-for="fAchievement"></span></label><textarea id="fAchievement" maxlength="500" placeholder="오늘 잘 해낸 것"></textarea></div>
    <div class="field"><label for="fTomorrow">내일은? <span class="count" data-count-for="fTomorrow"></span></label><textarea id="fTomorrow" maxlength="500" placeholder="내일 할 일이나 이어갈 것"></textarea></div>
    <div class="save-hint" id="saveHint" role="status" aria-live="polite">&nbsp;</div>
  </div></details>
</section>
<section id="view-calendar" class="view" data-view="calendar" hidden><div class="view-header"><h1>캘린더</h1><div class="month-nav"><button id="prevMonth" type="button" aria-label="이전 달">‹</button><span id="monthLabel"></span><button id="nextMonth" type="button" aria-label="다음 달">›</button></div></div><div class="cal-grid"><div class="cal-weekdays" aria-hidden="true"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div><div class="cal-days" id="calDays"></div></div><div class="day-sheet" id="daySheet" hidden></div></section>
<section id="view-history" class="view" data-view="history" hidden><div class="view-header"><h1>히스토리</h1></div><div class="search-box"><input type="search" id="searchInput" autocomplete="off" placeholder="날짜, 시간, 종류, 내용, 회고 검색" aria-label="히스토리 검색"></div><div class="hist-list" id="histList"></div></section>
<section id="view-settings" class="view" data-view="settings" hidden><div class="view-header"><h1>설정</h1></div><div class="settings-wrap">
  <section class="setting-card"><h2>동기화</h2><p class="setting-hint">기록은 항상 이 기기에 먼저 저장돼. 온라인이 되면 Google Sheets와 자동으로 맞춰져.</p><div class="field"><label for="gasUrlInput">Apps Script 웹 앱 URL</label><textarea id="gasUrlInput" rows="2" placeholder="https://script.google.com/macros/s/.../exec"></textarea></div><div class="field"><label for="gasTokenInput">API 토큰</label><div class="secret-row"><input type="password" id="gasTokenInput" autocomplete="off" placeholder="Code.gs TOKEN과 같은 값"><button id="toggleToken" class="small-btn" type="button" aria-pressed="false">보기</button></div></div><div class="button-row"><button class="action primary" id="gasUrlSave" type="button">연결 확인</button><button class="action" id="syncNowBtn" type="button">지금 동기화</button><button class="action" id="fullSyncBtn" type="button">전체 다시 맞추기</button></div><p class="setting-hint status" id="gasStatusText" role="status" aria-live="polite"></p></section>
  <section class="setting-card"><h2>데이터 · 백업</h2><div class="button-row"><button class="action" id="exportJson" type="button">JSON 백업</button><button class="action" id="exportCsv" type="button">CSV 내보내기</button><button class="action" id="importJson" type="button">백업 불러오기</button></div><p class="setting-hint" id="dataStatus"></p><input id="importFile" type="file" accept="application/json,.json" hidden></section>
  <section class="setting-card danger"><h2>복구 · 초기화</h2><p class="setting-hint">로컬 캐시를 초기화해도 Google Sheets 데이터는 다음 동기화 때 다시 내려와.</p><button class="action danger-btn" id="resetLocal" type="button">로컬 캐시 초기화</button></section>
  <section class="setting-card"><h2>앱 정보</h2><p class="setting-hint" id="appInfo"></p><p class="setting-hint" id="storageInfo"></p></section>
</div></section>
<nav class="tab-bar" aria-label="주요 메뉴"><button class="tab-btn active" data-view="today" type="button" aria-current="page"><span>오늘</span></button><button class="tab-btn" data-view="calendar" type="button"><span>캘린더</span></button><button class="tab-btn" data-view="history" type="button"><span>히스토리</span></button><button class="tab-btn" data-view="settings" type="button"><span>설정</span></button></nav>
</div>
<dialog id="editDialog" class="edit-dialog"><form method="dialog" id="editForm"><h2>기록 수정</h2><input type="hidden" id="editId"><div class="edit-grid"><label>시간<input id="editTime" type="time" required></label><label>종류<select id="editCat"><option value="업무">업무</option><option value="회의">회의</option><option value="요청">요청받은 일</option><option value="해결">해결한 문제</option><option value="기타">기타</option></select></label></div><label class="edit-content">내용<input id="editContent" type="text" maxlength="500" required></label><div class="dialog-actions"><button class="danger-link" id="editDelete" type="button">삭제</button><span></span><button class="action" id="editCancel" type="button">취소</button><button class="action primary" id="editSave" type="submit">저장</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div><div class="undo" id="undoBar" role="status" aria-live="assertive" hidden><span id="undoText"></span><button id="undoBtn" type="button">실행 취소</button></div>
<script src="app.js"></script></body></html>
